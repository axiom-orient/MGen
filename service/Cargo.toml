[package]
name = "mgen"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
dashmap = "6.0"
reqwest = { version = "0.12", features = ["json"] }
zip = "2.2"
walkdir = "2.5"
