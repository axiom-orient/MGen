# TMAndroid Gradle Properties
# Generated for {{ cookiecutter.project_name }}

# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Android Build
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.enableAdditionalTestOutput=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Kotlin Multiplatform (for future KMP support)
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2

# Build Cache
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn

# Java Toolchains
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Compiler options
kapt.incremental.apt=true
kapt.use.worker.api=true

# Performance
org.gradle.daemon=true
org.gradle.workers.max=8

# Project Info
POM_NAME={{ cookiecutter.project_name }}
POM_DESCRIPTION={{ cookiecutter.project_name }}
POM_URL=https://github.com/{{ cookiecutter.organization_name }}/{{ cookiecutter.project_slug }}
POM_SCM_URL=https://github.com/{{ cookiecutter.organization_name }}/{{ cookiecutter.project_slug }}
POM_SCM_CONNECTION=scm:git:git://github.com/{{ cookiecutter.organization_name }}/{{ cookiecutter.project_slug }}.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/{{ cookiecutter.organization_name }}/{{ cookiecutter.project_slug }}.git
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_DEVELOPER_ID={{ cookiecutter.organization_name }}
POM_DEVELOPER_NAME={{ cookiecutter.organization_name }}

# Signing (for release builds)
# signing.keyId=
# signing.password=
# signing.secretKeyRingFile=
